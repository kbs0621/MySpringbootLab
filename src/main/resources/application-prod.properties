myprop.name=Spring PROD

# log level을 info로 설정
logging.level.com.rookies4.myspringbootlab=info

#mariaDB 접속 정보 설정
spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_DATABASE:lab_db}
spring.datasource.username=${DB_USERNAME:lab}
spring.datasource.password=${DB_PASSWORD:lab}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# jpa 정보 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect